server.port=8080

# Logging
logging.level.root=INFO
logging.level.com.devbridge=DEBUG

# Multipart uploads — FAWB dataModel JSON files can be ~1.5 MB; allow headroom
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# --- Hot reload (dev) ---
# Disable browser caching of static resources so edits reflect on refresh
spring.web.resources.cache.period=0
# Also serve static files directly from the source folder in dev — bypasses target/classes
# so HTML/CSS/JS changes reflect on browser refresh without waiting for IntelliJ to copy resources
spring.web.resources.static-locations=file:./src/main/resources/static/,classpath:/static/
# Devtools LiveReload server (default port 35729). The LiveReload browser extension will auto-refresh on save.
spring.devtools.livereload.enabled=true
# Trigger devtools restart when files in these paths change (Java classes only, not static)
spring.devtools.restart.additional-exclude=static/**
